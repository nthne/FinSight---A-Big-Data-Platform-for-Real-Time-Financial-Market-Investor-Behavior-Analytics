[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-data-platform"
version = "0.1.0"
description = "Kafka, Spark, MinIO and MongoDB data-platform components for FinSight"
requires-python = ">=3.12,<3.14"
dependencies = [
  "confluent-kafka==2.16.0",
  "fastapi==0.135.2",
  "graphframes-py==0.12.3",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pyarrow==23.0.1",
  "pymongo==4.15.3",
  "pyspark==4.0.4",
  "PyYAML==6.0.3",
  "uvicorn==0.42.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["ingestion*", "serving*", "spark*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "serving/tests", "spark/tests", "storage/tests", "tests"]
addopts = "-ra"

