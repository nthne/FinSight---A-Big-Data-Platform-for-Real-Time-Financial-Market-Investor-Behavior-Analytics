# Spark SQL catalog settings for experiments that compare catalog-backed
# bucketing. Mount both directories on persistent storage in the Spark driver.
spark.sql.catalogImplementation=hive
spark.sql.warehouse.dir=file:///var/lib/spark/warehouse
spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
spark.sql.hive.metastore.version=2.3.9
spark.sql.hive.metastore.jars=builtin
