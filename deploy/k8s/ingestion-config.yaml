apiVersion: v1
kind: ConfigMap
metadata:
  name: finsight-ingestion-config
  namespace: finsight
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_CLIENT_ID: finsight-ingestion
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  BRONZE_BASE_URI: s3://fin-sight
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: fin-sight
  KNOWN_ASSET_SYMBOLS: AAPL,TSLA,MSFT,BTC,GOLD
