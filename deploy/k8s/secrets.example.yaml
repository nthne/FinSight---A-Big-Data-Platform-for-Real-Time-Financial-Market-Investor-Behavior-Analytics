apiVersion: v1
kind: Secret
metadata:
  name: finsight-platform-secrets
  namespace: finsight
type: Opaque
stringData:
  gateway-token: replace-with-at-least-32-random-characters
  analytics-user-salt: replace-with-at-least-32-random-characters
  minio-access-key: finsight-local
  minio-secret-key: replace-with-at-least-16-random-characters
  mongodb-root-username: finsight-root
  mongodb-root-password: replace-with-at-least-24-random-characters
  mongodb-writer-username: finsight-writer
  mongodb-writer-password: replace-with-at-least-24-random-characters
  mongodb-reader-username: finsight-reader
  mongodb-reader-password: replace-with-at-least-24-random-characters
  # Keep the three URIs consistent with the credentials above. URI-encode passwords.
  mongodb-admin-uri: mongodb://finsight-root:replace-me@mongodb:27017/admin?authSource=admin
  mongodb-writer-uri: mongodb://finsight-writer:replace-me@mongodb:27017/finsight?authSource=finsight
  mongodb-reader-uri: mongodb://finsight-reader:replace-me@mongodb:27017/finsight?authSource=finsight
  supabase-url: https://example.supabase.co
  supabase-publishable-key: sb_publishable_replace_me
  supabase-secret-key: sb_secret_replace_me
  grafana-admin-password: replace-with-at-least-20-random-characters
