name: finsight-data-integration

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    build:
      context: ..
      dockerfile: storage/minio/Dockerfile
    image: finsight-minio:course
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: finsight-local
      MINIO_ROOT_PASSWORD: finsight-local-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  ingestion:
    build:
      context: ..
      dockerfile: ingestion/Dockerfile
    image: finsight-ingestion:dev
    ports:
      - "18080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INGESTION_GATEWAY_TOKEN: local-integration-token
      KNOWN_ASSET_SYMBOLS: AAPL,TSLA,MSFT,BTC,GOLD
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  topic-init:
    image: finsight-ingestion:dev
    command: ["python", "-m", "ingestion.kafka.create_topics"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  storage-init:
    image: finsight-ingestion:dev
    command: ["python", "-m", "storage.jobs.init_object_store"]
    environment:
      BRONZE_BASE_URI: s3://fin-sight
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: finsight-local
      MINIO_SECRET_KEY: finsight-local-secret
    depends_on:
      minio:
        condition: service_healthy

  bronze-once:
    profiles: ["jobs"]
    image: finsight-ingestion:dev
    command:
      - python
      - -m
      - storage.jobs.kafka_to_bronze
      - --run-id
      - ${BRONZE_RUN_ID:-compose-manual}
      - --max-records
      - ${BRONZE_MAX_RECORDS:-10000}
      - --poll-timeout
      - ${BRONZE_POLL_TIMEOUT:-10}
    environment:
      BRONZE_BASE_URI: s3://fin-sight
      BRONZE_CONSUMER_GROUP: finsight-bronze-v1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KNOWN_ASSET_SYMBOLS: AAPL,TSLA,MSFT,BTC,GOLD
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: finsight-local
      MINIO_SECRET_KEY: finsight-local-secret
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  kafka-data:
  minio-data:
